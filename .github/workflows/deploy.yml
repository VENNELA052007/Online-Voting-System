name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install packages
        run: npm ci

      - name: Build website
        run: npm run build

      - name: Add Pages marker
        run: touch dist/.nojekyll

      - name: Publish built website
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist

      - name: Configure Pages source
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          pages_url="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
          pages_status=$(curl --silent --show-error --output /tmp/pages-response.json \
            --write-out "%{http_code}" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$pages_url")

          if [ "$pages_status" = "404" ]; then
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GITHUB_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --data '{"source":{"branch":"gh-pages","path":"/"}}' \
              "$pages_url"
          elif [ "$pages_status" = "200" ]; then
            curl --fail-with-body --silent --show-error \
              --request PATCH \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GITHUB_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --data '{"source":{"branch":"gh-pages","path":"/"}}' \
              "$pages_url"
          else
            cat /tmp/pages-response.json
            echo "Unexpected GitHub Pages API response: HTTP $pages_status"
            exit 1
          fi
